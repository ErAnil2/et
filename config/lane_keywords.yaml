# 23 comprehensive US-Discover lanes derived from 820 real DiscoverTrends
# observations (2026-09-23 exports). Patterns use Python-regex verbose mode
# (re.VERBOSE + re.IGNORECASE — whitespace/newlines inside are ignored,
# use \s or explicit boundaries where needed). All lanes seed with
# in_et_lane=1; editorial can flip individual slugs to 0 via SQL later.

real_estate_wealth:
  label: "Real Estate & Wealth"
  pattern: |
    \b(mansion|estate|ranch|acres?|vineyard|net\ worth|
    luxury|villa|penthouse|graceland|napa|sonoma|
    hollywood\ retreat|celebrity\ home|
    bought[^.]{0,40}(million|billion|\$)|
    listed\ for[^.]{0,30}(million|billion|\$))\b

personal_finance_benefits:
  label: "Personal Finance & Benefits"
  pattern: |
    \b(social\ security|medicare|medicaid|irs|tax\ refund|
    cola|401[- ]?k|retirement|pension|ssi|stimulus|
    snap\ benefits|1040|earnings\ limit|4[,.]?427|
    disability\ compensation|va\ benefits)\b

retail_business_pulse:
  label: "Retail & Business"
  pattern: |
    \b(closing\ (all|down)|bankruptcy|chapter\ 11|
    store\ closing|franchisee|kroger|costco|aldi|
    jcpenney|walmart|wendy'?s|amazon\ prime|
    doj\ (letters?|probe|investigation))\b

politics_policy:
  label: "Politics & Policy"
  pattern: |
    \b(bill\ (proposes|passes|introduc)|congress|senate|
    house\ of\ representatives|white\ house|trump|biden|
    regulation|permanent\ daylight\ saving|dst|
    32[- ]?hour\ work\ week|executive\ order)\b

crime_courts:
  label: "Crime & Courts"
